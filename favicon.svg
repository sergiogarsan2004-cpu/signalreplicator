<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- degradado con brillo arriba y sombra abajo: da volumen sin ser 3D -->
    <linearGradient id="cuerpo" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.45" stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151922"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <!-- sombra difusa proyectada -->
    <filter id="sombra" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>

  <!-- capa de profundidad: copia oscura desplazada detrás (extrusión sutil) -->
  <path d="M300 84 L150 300 H244 L212 428 L362 212 H268 Z"
        transform="translate(6 10)" fill="#053B2E"/>

  <!-- rayo principal con sombra proyectada -->
  <g filter="url(#sombra)">
    <path d="M300 84 L150 300 H244 L212 428 L362 212 H268 Z" fill="url(#cuerpo)"/>
  </g>

  <!-- brillo/canto superior para el toque de volumen -->
  <path d="M300 84 L150 300 H244 L212 428 L362 212 H268 Z"
        fill="none" stroke="#BBF7D0" stroke-opacity="0.55" stroke-width="6" stroke-linejoin="round"/>
</svg>
